# Polls upstream hourly; rebuilds + pushes to GHCR only when it moved
# (or on infra change / manual dispatch with force). Watchtower on the host
# then auto-pulls :latest. The built commit is recorded in last-upstream-sha
# (exact SHA is passed as UPSTREAM_REF, so image content == recorded commit).
#
# Fail-safe multi-arch strategy:
# - amd64 and arm64 each build NATIVELY (ubuntu-24.04 / ubuntu-24.04-arm).
#   No QEMU runs Node/npm, so an arch-specific npm crash fails that job.
# - Each arch pushes only its own internal tag (amd64-<sha>/arm64-<sha>).
#   Neither build job touches :latest.
# - :latest is assembled via `docker buildx imagetools create` only after
#   BOTH arch jobs succeed, so a broken arch never poisons Watchtower.
# - The bot commit touches only last-upstream-sha, which is excluded from the
#   push path filter below, so recording a SHA never triggers a rebuild loop.
name: Build Hub image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/docker-publish.yml
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if upstream is unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: build-hub-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ec061/token-monitor-hub-node

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/Javis603/token-monitor.git main | cut -f1)
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          LAST_SHA=$(cat last-upstream-sha 2>/dev/null || true)
          echo "Upstream: $UPSTREAM_SHA (last built: ${LAST_SHA:-none}, event: ${{ github.event_name }}, force: ${{ github.event.inputs.force }})."
          # Push events only fire for Dockerfile/workflow path changes (see
          # `on.push.paths`), so any push means infra changed: rebuild even
          # if the upstream SHA is unchanged.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Infra change (push to Dockerfile/workflow), rebuilding upstream $UPSTREAM_SHA."
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual forced rebuild of upstream $UPSTREAM_SHA."
          elif [ "$UPSTREAM_SHA" != "$LAST_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Upstream moved, building $UPSTREAM_SHA."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged ($UPSTREAM_SHA), skipping build."
          fi

  build-amd64:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:amd64-${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          build-args: UPSTREAM_REF=${{ needs.resolve.outputs.sha }}

  build-arm64:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    # Native ARM64: Node/npm never run under QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:arm64-${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: UPSTREAM_REF=${{ needs.resolve.outputs.sha }}

  publish:
    needs:
      - resolve
      - build-amd64
      - build-arm64
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish :latest manifest (amd64 + arm64)
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:amd64-${{ needs.resolve.outputs.sha }}" \
            "${{ env.IMAGE }}:arm64-${{ needs.resolve.outputs.sha }}"
          docker buildx imagetools inspect "${{ env.IMAGE }}:latest"

  record-sha:
    needs:
      - resolve
      - publish
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Record built upstream SHA
        run: |
          printf '%s' "${{ needs.resolve.outputs.sha }}" > last-upstream-sha
          # A manual/infra rebuild may target the already-recorded SHA; only
          # commit when the file actually changed so "nothing to commit"
          # never fails the job.
          if ! git diff --quiet -- last-upstream-sha; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-upstream-sha
            git commit -m "chore: record hub image upstream ${{ needs.resolve.outputs.sha }}"
            git push
          else
            echo "last-upstream-sha already up to date, nothing to commit."
          fi

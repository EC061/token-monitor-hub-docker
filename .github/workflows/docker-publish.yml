# Polls upstream hourly; rebuilds + pushes to GHCR only when it moved
# (or on manual dispatch with force). Watchtower on the host then auto-pulls.
# The built commit is recorded in last-upstream-sha (exact SHA is passed as
# UPSTREAM_REF, so image content == recorded commit).
name: Build Hub image

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if upstream is unchanged'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  packages: write

concurrency:
  group: build-hub-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/Javis603/token-monitor.git main | cut -f1)
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          LAST_SHA=$(cat last-upstream-sha 2>/dev/null || true)
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$UPSTREAM_SHA" != "$LAST_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Building upstream $UPSTREAM_SHA (last built: ${LAST_SHA:-none})."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged ($UPSTREAM_SHA), skipping build."
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.check.outputs.changed == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.changed == 'true'
      - uses: docker/login-action@v4
        if: steps.check.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.check.outputs.changed == 'true'
        with:
          context: .
          push: true
          # Oracle ARM host needs arm64; keep amd64 for portability.
          # buildx builds both and pushes one merged manifest list.
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/ec061/token-monitor-hub-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: UPSTREAM_REF=${{ steps.check.outputs.sha }}

      - name: Record built upstream SHA
        if: steps.check.outputs.changed == 'true'
        run: |
          printf '%s' "${{ steps.check.outputs.sha }}" > last-upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-upstream-sha
          git commit -m "chore: record hub image upstream ${{ steps.check.outputs.sha }}" && git push

# Builds the Dockerfile in this repo and pushes to GHCR daily + on manual dispatch.
# Watchtower on the host then auto-pulls it.
# First manual run: Actions -> "Build Hub image" -> Run workflow (creates the ghcr package,
# set it to Public if you want unauthenticated pulls).
name: Build Hub image

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ec061/token-monitor-hub-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: UPSTREAM_REF=main
